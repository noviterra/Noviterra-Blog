syntax = "proto3";
package articlerpc;
option go_package = "/articlerpc";

// 9004
/*
goctl rpc protoc ./doc/proto/article.proto --go_out=./server/app/article/articlerpc/types --go-grpc_out=./server/app/article/articlerpc/types --zrpc_out=./server/app/article/articlerpc
*/

service ArticleService {
    // 发布文章
    rpc PublishArticle(PublishArticleRequest) returns (PublishArticleResponse);
    // 删除文章
    rpc DeleteArticle(DeleteArticleRequest) returns (Response);
    // 修改文章
    rpc UpdateArticle(UpdateArticleRequest) returns (Response);
    // 修改文章封面
    rpc UpdateArticleCover(UpdateArticleCoverRequest) returns (UpdateArticleCoverResponse);
    // 查询文章列表
    rpc GetArticleList(GetArticleListRequest) returns (GetArticleListResponse);
    // 搜索文章
    rpc SearchArticle(SearchArticleRequest) returns (SearchArticleResponse);
    // 查询文章详细信息
    rpc GetArticleDetail(GetArticleDetailRequest) returns (GetArticleDetailResponse);
    // 得到文章归档
    rpc GetArchive(GetArchiveRequest) returns (GetArchiveResponse);
    // 得到用户发布的全部文章列表
    rpc GetUserArticleList(GetUserArticleListRequest) returns (GetArticleListResponse);
    // 得到用户点赞或收藏的全部文章列表
    rpc GetUserLikeArticleList(GetUserLikeCollectArticleListRequest) returns (GetArticleListResponse);
}

// 统一响应封装 封装请求执行状态code和message 需要附带数据将其嵌入结构体中
message Response {
    string Message = 1;
    int64 Code = 2;
    int32 Status = 3;
}

// 列表中单个文章属性 显示除内容之外的数据
message ArticleList {
    int64 ArticleID = 1;
    string Title = 2;
    string Cover = 3;
    repeated string Tags = 4;
    string Information = 5;
    int64 CreatedAt = 6;
}

// 文章详细属性
message Article {
    int64 ArticleID = 1;
    string PublisherID = 2;
    string Title = 3;
    string Content = 4;
    string Cover = 5;
    repeated string Tags = 6;
    string Information = 7;
    int64 CreatedAt = 8;
    int64 UpdatedAt = 9;
}

// 归档中单个文章详细属性
message ArchiveArticle {
    string Title = 1;
    string Action = 2;
    int64 Time = 3;
}

// 发布文章请求体
message PublishArticleRequest {
    string Title = 1;
    string Content = 2;
    string Cover = 3;
    string Information = 4;
    repeated string Tags = 5;
}
// 发布文章响应体 返回articleID
message PublishArticleResponse {
    int64 ArticleID = 1;
    Response Resp = 2;
}

// 删除文章请求体
message DeleteArticleRequest {
    int64 ArticleID = 1;
}

// 修改文章请求体
message UpdateArticleRequest {
    int64 ArticleID = 1;
    string Title = 2;
    string Content = 3;
    string Information = 4;
    repeated string Tags = 5;
}

// 修改文章封面请求体
message UpdateArticleCoverRequest {
    string NewCover = 1;
    int64 ArticleID = 2;
}
// 修改文章封面响应体 返回新封面
message UpdateArticleCoverResponse {
    string Cover = 1;
    Response Resp = 2;
}

// 查询文章列表请求体
message GetArticleListRequest {
    int32 Page = 1;
    int32 PageSize = 2;
}
// 查询文章列表响应
message GetArticleListResponse {
    repeated ArticleList Articles = 1;
    int64 TotalCount = 2;
    Response Resp = 3;
}

// 搜索文章请求体
message SearchArticleRequest {
    string Query = 1;
    int32 Page = 2;
    int32 PageSize = 3;
}
// 搜索文章响应
message SearchArticleResponse {
    repeated ArticleList Articles = 1;
    int64 TotalCount = 2;
    Response Resp = 3;
}

// 查询文章详细信息请求体
message GetArticleDetailRequest {
    int64 ArticleID = 1;
}
// 查询文章详细信息响应
message GetArticleDetailResponse {
    Article A = 1;
    Response Resp = 2;
}

// 得到文章归档请求体
message GetArchiveRequest {  // 无实际字段 但使用是必要的
}
// 文章归档响应体
message GetArchiveResponse {
    repeated ArchiveArticle Archives = 1;
    Response Resp = 2;
}

// 得到用户发布的全部文章列表
message GetUserArticleListRequest {
    string UserID = 1;
    int32 Page = 2;
    int32 PageSize = 3;
}

// 得到用户点赞、收藏的全部文章列表
message GetUserLikeCollectArticleListRequest {
    string UserID = 1;
    int32 Page = 2;
    int32 PageSize = 3;
    string Field = 4;
}