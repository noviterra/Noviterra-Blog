syntax = "proto3";
package commentrpc;
option go_package = "/commentrpc";

// 9005

/*
goctl rpc protoc ./doc/proto/comment.proto --go_out=./server/app/comment/commentrpc/types --go-grpc_out=./server/app/comment/commentrpc/types --zrpc_out=./server/app/comment/commentrpc
*/

service CommentService {
  // 对文章的点赞操作
  rpc LikeArticle(LikeArticleRequest) returns (Response);
  // 对文章的收藏操作
  rpc CollectArticle(CollectArticleRequest) returns (Response);
  // 发表评论
  rpc CreateComment(CommentRequest) returns (CommentResponse);
  // 得到某个位置的全部顶层评论
  rpc GetTopComment(GetTopCommentRequest) returns (GetTopCommentResponse);
  // 得到某个评论的全部子评论
  rpc GetTreeComment(GetTreeCommentRequest) returns (GetTreeCommentResponse);
}

message Response {
  string Message = 1;
  int32 Status = 2;
  int64 Code = 3;
}

// 单个评论应该展示的信息
message CommentInfo {
  int64 CommentID = 1;
  string SpeakerName = 2;
  string SpeakerAvatar = 3;
  string Content = 4;
  int64  Count = 5;
  int64 SpeakTime = 6;
}

// 单个子评论展示的信息
message TreeCommentInfo {
  int64 CommentID = 1;
  string SpeakerName = 2;
  string SpeakerAvatar = 3;
  string Content = 4;
  int64 SpeakTime = 5;
}

message LikeArticleRequest {
  int64 ArticleID = 1;
  string Action = 2;
  string OperatorID = 3;
}

message CollectArticleRequest {
  int64 ArticleID = 1;
  string Action = 2;
  string OperatorID = 3;
}

message CommentRequest {
  int64 Address = 1;
  int64 ParentID = 2;
  string SpeakerID = 3;
  string Content = 4;
}

message CommentResponse {
  int64 CommentID = 1;  // 评论成功后返回该条评论的唯一ID
  Response Resp = 2;
}

// 得到某个位置的顶层评论
message GetTopCommentRequest {
  int64 address = 1;
}
message GetTopCommentResponse {
  repeated CommentInfo Comments = 1;
  Response Resp = 2;
}

// 得到某个评论的全部子评论
message GetTreeCommentRequest {
  int64 CommentID = 1;
}
message GetTreeCommentResponse {
  repeated TreeCommentInfo Comments = 1;
  Response Resp = 2;
}
