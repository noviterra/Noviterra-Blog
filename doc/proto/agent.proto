syntax = "proto3";
package agentrpc;
option go_package = "/agentrpc";

// 9007
/*
goctl rpc protoc ./doc/proto/agent.proto --go_out=./server/app/agent/agentrpc/types --go-grpc_out=./server/app/agent/agentrpc/types --zrpc_out=./server/app/agent/agentrpc
*/

service AgentService {
  // 非流式对话 一次性返回 便于后台测试与兜底
  rpc Chat(ChatRequest) returns (ChatResponse);
  // 流式对话 API层转SSE
  rpc ChatStream(ChatRequest) returns (stream ChatStreamEvent);
  // 配置对话助手
  rpc Deploy(DeployAgentRequest) returns (Response);
  // 重建知识库索引 切片+向量化
  rpc SyncKnowledge(SyncKnowledgeRequest) returns (SyncKnowledgeResponse);
}

message Source {
  int64 ArticleID = 1;
  string Title = 2;
  string Snippet = 3;
  double Score = 4;
  int32 ChunkIndex = 5;
}

message Response {
  int32 Status = 1;
  int64  Code = 2;
  string Message = 3;
}

message ChatRequest {
  int64 SessionID = 1;
  string Query = 2;
  string User = 3;
}

message ChatResponse {
  string Content = 1;
  Response Resp = 2;
  int64 SessionID = 3;
  repeated Source Soureces = 4;
}

// ChatStreamEvent 流式事件
message ChatStreamEvent {
  string Type = 1;
  int64 SessionID = 2;
  string MessageID = 3;
  string Delta = 4;
  repeated Source Sources = 5;
  Response Resp = 6;
}

message DeployAgentRequest {
  string BaseURL = 1;
  string APIKey = 2;
  string Model = 3;
  string Provider = 4;
  string EmbeddingModel = 5;
}

message SyncKnowledgeRequest {
  bool Full = 1;
}

message SyncKnowledgeResponse {
  int64 ArticleCount = 1;
  int64 ChunkCount = 2;
  int64 EmbeddedCount = 3;
  int64 SkippedCount = 4;
  int64 FailedCount = 5;
  int64 DurationMS = 6;
  Response Resp = 7;
}
