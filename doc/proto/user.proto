syntax = "proto3";
package userrpc;
option go_package = "/userrpc";

// 9003

// 基本响应体
message Response {
    string Message = 1;
    int64 Code = 2;
}

message UserInfo {
    string ID = 1;
    int64 Role = 2;
    string UserName = 3;
    string Email = 4;
    string Avatar = 5;
    int64  Age = 6;
    int64  Gender = 7;
    string SelfIntroduction = 8;
    int64 CreateAt = 9;
    int64 UpdatedAt = 10;
}

// 通过账号修改密码
message ChangePasswordRequest {
    string ID = 1;
    string OldPassword = 2;
    string NewPassword = 3;
}

// 通过邮箱修改密码
message ChangePasswordByEmailRequest {
    string ID = 1;
    string Email = 2;
    string VerificationCode = 3;
    string NewPassword = 4;
}

// 获取个人信息
message GetUserInfoRequest {
    string ID = 1;
}
message UserInfoResponse {
    Response Resp = 1;
    UserInfo data = 2;
}

// 修改个人信息
message UpdateUserInfoRequest {
    string ID = 1;  // 获取用户实例的凭证 鉴权中间件获取
    string UserName = 2;
    // string Email = 3;  // 涉及另一个功能：账号换绑 在此不能修改
    string Avatar = 3;
    int64  Age = 4;
    int64  Gender = 5;
    string SelfIntroduction = 6;
}

// 批量获取用户信息
message GetMoreUsersInfoRequest {
    int64 size = 1;
    int64 page = 2;
}
message GetMoreUsersInfoResponse {
    repeated UserInfo UsersInfo = 1;
    Response Resp = 2;
}

// 封禁用户
message BlackUserRequest {
    string ID = 1;
    string Operator = 2;
}

// 解封用户
message UnBlackUserRequest {
    string ID = 1;
    string Operator = 2;
}

// 服务接口
service UserService {
    // 获取个人信息
    rpc GetSelfInfo(GetUserInfoRequest) returns(UserInfoResponse);
    // 更新个人信息
    rpc UpdateSelfInfo(UpdateUserInfoRequest) returns(Response);
    // 通过账号密码认证进行密码修改
    rpc ChangeSelfPasswordByID(ChangePasswordRequest) returns(Response);
    // 通过邮箱验证修改密码
    rpc ChangeSelfPasswordByEmail(ChangePasswordByEmailRequest) returns(Response);
    // 管理员对用户操作 拉黑用户
    rpc BlackUser(BlackUserRequest) returns(Response);
    // 解封用户 
    rpc UnBlackUser(UnBlackUserRequest) returns(Response);
    // 管理员批量获取用户信息
    rpc GetMoreUsersInfo(GetMoreUsersInfoRequest) returns(GetMoreUsersInfoResponse);
}

// goctl rpc protoc ./doc/proto/user.proto --go_out=./server/app/user/userrpc/types --go-grpc_out=./server/app/user/userrpc/types --zrpc_out=./server/app/user/userrpc