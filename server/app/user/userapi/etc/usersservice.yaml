Name: usersService
Host: 0.0.0.0
Port: 8888

JWT:
  AccessSecret: ${JWT_ACCESSSECRET}
  AccessExpire: ${JWT_ACCESSEXPIRE}
  RefreshSecret: ${JWT_REFRESHSECRET}
  RefreshExpire:  ${JWT_REFRESHEXPIRE}

UserRpc:
  Etcd:
    Hosts:
    - ${ETCD_HOST}
    Key: ${USER_RPC}

Repo:
  UserName: ${MYSQL_USER}
  Password: ${MYSQL_PASSWORD}
  Host: ${MYSQL_HOST}
  Port: ${MYSQL_PORT}
  DBName: ${MYSQL_DB}